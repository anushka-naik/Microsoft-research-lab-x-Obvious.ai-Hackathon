name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test, lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: syncro-main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: syncro-main/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Tests (vitest run)
        run: npx vitest run

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build (vite build)
        run: npm run build
