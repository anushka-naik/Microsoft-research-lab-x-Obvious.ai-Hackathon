name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test, lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: syncro-main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: syncro-main/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Tests (vitest run, JUnit report)
        run: npx vitest run --reporter=junit --outputFile=./test-results/junit.xml

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build (vite build)
        run: npm run build

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit-report
          path: syncro-main/test-results/junit.xml
          if-no-files-found: error

      - name: Run summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## CI summary
          - Steps: vitest (JUnit report uploaded as `vitest-junit-report`), lint, typecheck, build.
          - **Branch protection recommendation:** require the `Test, lint, typecheck, build` check as a
            status check on `main` (Settings → Branches → Branch protection rules → Require status checks
            to pass), so no PR merges without independent verification.
          EOF
